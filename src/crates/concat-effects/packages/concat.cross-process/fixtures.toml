[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1.0]
expect = [0.19066, 0.20496, 0.22186, 1.0]

[[probe]]
name = "default, a highlight past white"
input = [4.0, 1.0, 0.05, 1.0]
expect = [2.05, 0.961, 0.12735, 1.0]

[[probe]]
name = "default, half transparent"
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.5065, 0.2234, 0.1637, 0.5]

[[probe]]
name = "minimum, a grey"
at = "min"
input = [0.18, 0.18, 0.18, 1.0]
expect = [0.18, 0.18, 0.18, 1.0]

[[probe]]
name = "maximum, a grey"
at = "max"
input = [0.18, 0.18, 0.18, 1.0]
expect = [0.1964, 0.2184, 0.2444, 1.0]
