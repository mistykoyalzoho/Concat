[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1.0]
expect = [0.150644, 0.150644, 0.150644, 1.0]

[[probe]]
name = "default, a highlight past white"
input = [4.0, 1.0, 0.05, 1.0]
expect = [3.347653, 0.836913, 0.041846, 1.0]

[[probe]]
name = "default, half transparent"
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.418457, 0.167383, 0.083691, 0.5]

[[probe]]
name = "minimum, a grey"
at = "min"
input = [0.18, 0.18, 0.18, 1.0]
expect = [0.045, 0.045, 0.045, 1.0]

[[probe]]
name = "maximum, a grey"
at = "max"
input = [0.18, 0.18, 0.18, 1.0]
expect = [0.18, 0.18, 0.18, 1.0]

[[probe]]
name = "maximum, a highlight past white"
at = "max"
input = [4.0, 1.0, 0.05, 1.0]
expect = [4.0, 1.0, 0.05, 1.0]
