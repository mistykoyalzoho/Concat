[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1.0]
expect = [0.183556, 0.183556, 0.183556, 1.0]

[[probe]]
name = "default, a highlight past white"
input = [4.0, 1.0, 0.05, 1.0]
expect = [4.003556, 1.003556, 0.053556, 1.0]

[[probe]]
name = "default, half transparent"
input = [0.5, 0.2, 0.1, 0.5]
expect = [0.503556, 0.203556, 0.103556, 0.5]

[[probe]]
name = "minimum, a grey"
at = "min"
input = [0.18, 0.18, 0.18, 1.0]
expect = [0.18, 0.18, 0.18, 1.0]

[[probe]]
name = "maximum, a grey"
at = "max"
input = [0.18, 0.18, 0.18, 1.0]
expect = [0.18889, 0.18889, 0.18889, 1.0]

[[probe]]
name = "maximum, a highlight past white"
at = "max"
input = [4.0, 1.0, 0.05, 1.0]
expect = [4.00889, 1.00889, 0.05889, 1.0]
