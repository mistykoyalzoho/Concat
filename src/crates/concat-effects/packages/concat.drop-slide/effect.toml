format = 2

[effect]
id = "concat.drop-slide"
name = "Drop Slide"
kind = "transition"
category = "Slide"
shelves = ["Slide"]
order = 104
description = "The incoming shot drops in from the right a little darker, brightening as it lands."

[[param]]
key = "lift"
label = "Lift"
min = 0
max = 40
default = 20
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
xfade = "slideleft"
fallback = "cross-fade"
