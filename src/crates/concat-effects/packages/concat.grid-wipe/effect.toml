format = 2

[effect]
id = "concat.grid-wipe"
name = "Grid Wipe"
kind = "transition"
category = "Wipe"
shelves = ["Wipe"]
order = 97
description = "The incoming shot appears tile by tile, each on its own hash."

[[param]]
key = "tiles"
label = "Tiles"
min = 2
max = 16
default = 8
step = 1
unit = ""

[transition]
entry = "effect.wgsl"
xfade = "pixelize"
fallback = "cross-fade"
